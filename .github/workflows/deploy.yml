name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Remplacez par master si votre branche principale s'appelle master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # force_orphan réécrit la branche gh-pages à chaque déploiement :
          # sans ce cname, le fichier CNAME peut disparaître et le domaine custom sauter.
          cname: train.huvioptimisation.com
          force_orphan: true
